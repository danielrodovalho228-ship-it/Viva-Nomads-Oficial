name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Trava de consistência (regra de ouro + vazamento de contato).
      - name: Consistência (vocabulário + vazamento)
        run: npm run check:consistency

      # Tipos e testes puros.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Testes
        run: npm test

      # Prompt 33: invariantes da ordem dos imóveis com 200 ofertas sintéticas (sai 1 se algum quebrar).
      - name: Simulação da ordem
        run: node scripts/simular-ordem.ts

      # DNS do e-mail (SPF, DKIM do Resend, DMARC): informativo, nunca derruba o CI.
      - name: DNS do e-mail
        continue-on-error: true
        run: node scripts/conferir-dns-email.ts

      # Build de produção.
      - name: Build
        run: npm run build
