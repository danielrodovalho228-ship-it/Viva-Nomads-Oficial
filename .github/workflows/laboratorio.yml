name: Laboratório de testes (noturno)

# Toda noite (e no disparo manual): sobe um Supabase LOCAL do zero dentro do runner (CLI + Docker),
# aplica TODAS as migrações + o acerto com produção, cria as personas (Ana,
# Paulo, Roberta, Gustavo) com uma senha nova e roda a suíte E2E contra
# localhost. O site é buildado UMA vez em modo INTEGRACOES_SIMULADAS (nada sai
# para a rede; job construir) e cada fatia reaproveita o mesmo .next. Nenhum segredo de produção é usado aqui — o banco morre no fim.
on:
  workflow_dispatch:
  # Frente 0 (correção consolidada de 11/11/2026): o push na main deixou de rodar a suíte inteira. Com 100–229 merges por
  # dia, cada push seria uma rodada de 21 jobs; e as rodadas de 10/11 e 11/11 (ainda num job só) gravaram ~610 executados
  # contra ~3.900 pulados sem ficar vermelhas. A suíte inteira roda no agendado e no disparo manual; o portão de cada PR
  # segue sendo o lab-critico (lista crítica + specs do próprio PR).
  # Em PR não roda (decisão do Muse, 21/10). Falha, rodada incompleta ou regressão deixam o consolidar vermelho.

permissions:
  contents: read

concurrency:
  # Um grupo por evento + ref: run de PR só cancela run do MESMO PR; push na main, agendada e manual
  # nunca são canceladas por PR (o resultado vai para o banco). Ordens e7a697e7/b2978f03/7d89643b.
  group: laboratorio-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  # PR novo cancela o PR velho; push na main nunca é cancelado no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

  # O MESMO ambiente no build (job construir) e nas fatias: as NEXT_PUBLIC_ entram no bundle no build.
env:
    NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    NEXT_PUBLIC_SITE_URL: http://localhost:3123
    INTEGRACOES_SIMULADAS: "on"
    LAB_OUTBOX: ${{ github.workspace }}/tests/laboratorio/saida/envios-simulados.jsonl
    # Resend falso (scripts/lab/resend-falso.mjs): confere o formato do e-mail e devolve um id; nada sai para a rede.
    LAB_RESEND_URL: http://127.0.0.1:3999
    # LinkedIn falso (scripts/lab/linkedin-falso.mjs, 63-B): OIDC mínimo com id_token RS256 de verdade; nada sai para a rede.
    LAB_LINKEDIN_URL: http://127.0.0.1:3997
    # Rotas falsas (scripts/lab/rotas-falso.mjs): tempos determinísticos no formato Mapbox/Google; nada sai para a rede.
    LAB_ROTAS_URL: http://127.0.0.1:3998
    TESTES_BASE_URL: http://localhost:3123

jobs:
  # E744: a suíte inteira (~4.500 testes) não cabia no teto de um job (run 42471821063: 640 rodaram, 3.864 não rodaram).
  # Agora ela é fatiada em FATIAS jobs paralelos (--shard do Playwright); cada fatia sobe o próprio Supabase local e o
  # próprio site, e o job `consolidar` junta os resultados e grava UMA linha em lab_execucoes. Desenho em docs/e744-suite-fatiada.md.
  laboratorio:
    name: laboratorio (controle E1019, fatia 3/16, repetição ${{ matrix.rep }})
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        fatia: [3]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Subir o Supabase local (todas as migrações)
        # E792: porta do banco presa na VM do runner ("failed to bind host port 0.0.0.0:54322/tcp", sem ninguém
        # escutando) → o script sobe o banco numa porta livre e grava LAB_DB_URL; outras falhas: limpa e reinicia o Docker.
        run: scripts/lab/subir-supabase.sh

      - name: Acertar com produção (role como texto + políticas extras)
        run: psql "$LAB_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/lab/alinhar-producao.sql

      - name: Conferir o banco (asserções de segurança)
        run: psql "$LAB_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/lab/conferir-banco.sql

      - name: Chaves locais e senha da noite (mascaradas)
        run: |
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          SENHA="$(openssl rand -hex 16)"
          SOCIOS="lab-$(openssl rand -hex 8)"
          echo "::add-mask::$ANON_KEY"; echo "::add-mask::$SERVICE_ROLE_KEY"; echo "::add-mask::$SENHA"; echo "::add-mask::$SOCIOS"
          {
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "LAB_SENHA=$SENHA"
            echo "SOCIOS_ACCESS_CODE=$SOCIOS"
          } >> "$GITHUB_ENV"

      - name: Criar as personas e os imóveis de teste
        run: node scripts/lab/seed-lab.mjs

      - name: Criar a massa da varredura visual (t249)
        # Contas @varredura.lab.vivanomads.test e tests/laboratorio/saida/varredura.json. Sem este passo a t249 ficava
        # pulada em toda execução. Se falhar, a suíte segue e a t249 reprova dizendo que falta a massa.
        continue-on-error: true
        run: node scripts/lab/massa-varredura.mjs

      - name: Baixar o build único (job construir)
        uses: actions/download-artifact@v4
        with:
          name: laboratorio-${{ github.run_id }}-build
          path: lab-build

      - name: Reaproveitar o .next (mesma chave anônima; páginas pré-renderizadas saem do banco desta fatia)
        # As NEXT_PUBLIC_ entram no bundle no build: se o Supabase desta fatia tivesse outra chave anônima, o navegador
        # falaria com a chave errada. Confere o sha256 da chave (nunca a chave) com o do build e para com erro claro.
        # Depois apaga a saída pré-renderizada do build (gerada com o banco do job construir): o servidor gera cada página
        # na primeira visita com o banco desta fatia (scripts/lab/limpar-prerender.mjs).
        run: |
          AGORA="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | sha256sum | cut -d' ' -f1)"
          if [ "$AGORA" != "$(cat lab-build/chave-anon.sha256)" ]; then
            echo "::error::a chave anônima do Supabase desta fatia não é a do build: o .next reaproveitado não serve."
            exit 1
          fi
          tar -xf lab-build/next.tar
          node scripts/lab/limpar-prerender.mjs .next

      - name: Subir o site em localhost:3123
        run: |
          node scripts/lab/resend-falso.mjs 3999 > tests/laboratorio/saida/resend-falso.log 2>&1 &
          node scripts/lab/linkedin-falso.mjs 3997 > tests/laboratorio/saida/linkedin-falso.log 2>&1 &
          node scripts/lab/rotas-falso.mjs 3998 > tests/laboratorio/saida/rotas-falso.log 2>&1 &
          npx next start -p 3123 > tests/laboratorio/saida/servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3123/ || (cat tests/laboratorio/saida/servidor.log; exit 1)

      - name: Instalar Chromium do Playwright
        # A instalação às vezes trava sem erro (apt/download). E744 (rodadas 42755440801 e 42767013537: 1 e 4 fatias perdidas, uns
        # 280 testes cada): tentativas CURTAS (5 min, até 4) para caber no teto do passo; o Chromium vem primeiro e sozinho
        # (todas as fatias precisam dele). O timeout mata o npx, mas o apt-get filho segura a trava do dpkg: antes de repetir,
        # encerra o apt que sobrou, espera a trava soltar e conserta o dpkg.
        timeout-minutes: 25
        run: |
          for i in 1 2 3 4; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "tentativa $i travou ou falhou"
            sudo pkill -f '[a]pt-get|[d]pkg' || true
            for _ in $(seq 1 40); do sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break; sleep 3; done
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Instalar WebKit do Playwright (só 3 specs de celular usam)
        # Se falhar, perdem-se só esses specs (aparecem como falha), não a fatia inteira.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          for i in 1 2; do
            timeout 240 npx playwright install --with-deps webkit && exit 0
            sudo pkill -f '[a]pt-get|[d]pkg' || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Rodar a suíte E2E
        id: e2e
        continue-on-error: true
        # Fatias 1–16: a suíte SEM o t48-varredura (LAB_PESADOS=fora), em 16 partes. Fatias 17–20: SÓ o t48-varredura, uma
        # fatia por grupo de testes (a cadeia é serial e leva ~100 min junta; separada, cada grupo leva <= 30 min).
        run: |
          F=${{ matrix.fatia }}
          # Varredura (17–20): um teste de até 30 min com 1 retry no CI (a do admin levou 56 min) -> teto de 100 min, e o job
          # tem 120 min para ainda sobrar tempo de guardar o resultado. As gerais seguem em 65 min.
          if [ "$F" -le 16 ]; then
            LAB_PESADOS=fora npx playwright test --shard=${{ matrix.fatia }}/16 --reporter=list,html,json --workers=2 --timeout=90000 --global-timeout=3900000 > tests/laboratorio/saida/e2e.txt 2>&1
          else
            case "$F" in
              17) GREP="visitante|endereços inexistentes|sitemap limpo" ;;
              18) GREP="inquilino: todas as telas logadas" ;;
              19) GREP="proprietário: todas as telas logadas" ;;
              20) GREP="admin: todas as telas logadas" ;;
            esac
            npx playwright test t48-varredura --grep "$GREP" --reporter=list,html,json --workers=1 --global-timeout=6000000 > tests/laboratorio/saida/e2e.txt 2>&1
          fi
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tests/laboratorio/saida/resultado.json

      - name: Guardar relatório, prints e vídeos das falhas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-${{ github.run_id }}-fatia-${{ matrix.fatia }}-rep-${{ matrix.rep }}
          path: |
            playwright-report/
            tests/e2e/.artifacts/
            tests/laboratorio/saida/
          retention-days: 14

      - name: Números e falhas desta fatia (erro completo no log)
        # E744: o banco guarda só 300 caracteres do erro e o relatório completo fica no artifact. Aqui cada falha sai com o
        # erro inteiro no log do job, que a API do GitHub entrega. Só imprime; o veredito é o passo seguinte.
        if: ${{ !cancelled() }}
        run: node scripts/lab/falhas-da-fatia.mjs tests/laboratorio/saida/resultado.json ${{ matrix.fatia }} || true

      - name: SONDA E1019 (t1629 na fatia real de 17/11)
        if: ${{ !cancelled() }}
        run: |
          grep -n "t1629" tests/laboratorio/saida/e2e.txt | sed 's/^/SONDA | /' || echo "SONDA | t1629 sem linha"
          grep -n -A12 "E916 a 404" tests/laboratorio/saida/e2e.txt | grep -i -e "Error" -e "expect" -e "toHave" -e "Received" -e "Expected" -e "spec.ts:" | sed 's/^/SONDA | /' | head -40 || true
          tail -5 tests/laboratorio/saida/e2e.txt | sed 's/^/SONDA | /'

      - name: Marcar a fatia como falha se algum teste falhou
        if: ${{ steps.e2e.outcome == 'failure' && github.event_name != 'pull_request' }}
        run: exit 1

  # Frente 0: o .next é construído UMA vez e as 20 fatias o reaproveitam (antes cada fatia buildava o site de novo). O build
  # precisa do Supabase local só para ter as mesmas chaves (a anônima entra no bundle) e para a pré-renderização ter onde ler;
  # o que ela gerou é apagado em cada fatia antes do `next start` (scripts/lab/limpar-prerender.mjs). Daqui sai também a
  # listagem do commit (`playwright test --list`), que o consolidar compara com o que rodou.
  construir:
    name: construir (build único e listagem)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Subir o Supabase local (para as chaves do bundle)
        # E792: porta do banco presa na VM do runner ("failed to bind host port 0.0.0.0:54322/tcp", sem ninguém
        # escutando) → o script sobe o banco numa porta livre e grava LAB_DB_URL; outras falhas: limpa e reinicia o Docker.
        run: scripts/lab/subir-supabase.sh

      - name: Acertar com produção (role como texto + políticas extras)
        run: psql "$LAB_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/lab/alinhar-producao.sql

      - name: Chaves locais (mascaradas)
        run: |
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          echo "::add-mask::$ANON_KEY"; echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build do site (modo simulado)
        run: npm run build

      - name: Listagem do commit (o que a rodada tem que executar)
        # Sem LAB_PESADOS: a suíte INTEIRA (as fatias 1–16 sem o t48 + as 17–20 só com o t48 cobrem exatamente esta lista).
        run: npx playwright test --list --reporter=json > lista.json

      - name: Empacotar o build
        # Só o .next (sem o cache do webpack) + o sha256 da chave anônima (nunca a chave) + a listagem.
        run: |
          mkdir -p lab-build
          tar --exclude='.next/cache' -cf lab-build/next.tar .next
          printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | sha256sum | cut -d' ' -f1 > lab-build/chave-anon.sha256
          cp lista.json lab-build/lista.json
          node -e 'const r=require("./lista.json");console.log("listados:",r.stats.skipped+r.stats.expected+r.stats.unexpected+r.stats.flaky)'

      - name: Guardar o build para as fatias
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-${{ github.run_id }}-build
          path: lab-build/
          retention-days: 2

      - name: Guardar a listagem para o consolidar
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-${{ github.run_id }}-lista
          path: lista.json
          retention-days: 14

  # Junta as fatias: um resumo, uma linha em public.lab_execucoes, e vermelho se qualquer fatia falhou.
