name: Laboratório de testes (noturno)

# Toda noite e a cada merge na main: sobe um Supabase LOCAL do zero dentro do runner (CLI + Docker),
# aplica TODAS as migrações + o acerto com produção, cria as personas (Ana,
# Paulo, Roberta, Gustavo) com uma senha nova, builda o site em modo
# INTEGRACOES_SIMULADAS (nada sai para a rede) e roda a suíte E2E contra
# localhost. Nenhum segredo de produção é usado aqui — o banco morre no fim.
on:
  schedule:
    - cron: "0 6 * * *" # 01h no Texas (horário de verão), 03h em Brasília
  workflow_dispatch:
  # Todo merge na main roda a suíte inteira (além das 03h) e grava o resultado em
  # public.lab_execucoes (ordem 225d0648).
  push:
    branches: [main]
  # Em PR não roda (decisão do Muse, 21/10): a suíte inteira não cabe no teto e ficava verde com teste falhando.
  # O portão de PR é o lab-critico (lista crítica + specs do próprio PR, falha = vermelho). Aqui, na main e no
  # noturno, falha também deixa o job vermelho (último passo).

permissions:
  contents: read

concurrency:
  # Um grupo por evento + ref: run de PR só cancela run do MESMO PR; push na main, agendada e manual
  # nunca são canceladas por PR (o resultado vai para o banco). Ordens e7a697e7/b2978f03/7d89643b.
  group: laboratorio-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  # PR novo cancela o PR velho; push na main nunca é cancelado no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SITE_URL: http://localhost:3123
      INTEGRACOES_SIMULADAS: "on"
      LAB_OUTBOX: ${{ github.workspace }}/tests/laboratorio/saida/envios-simulados.jsonl
      # Resend falso (scripts/lab/resend-falso.mjs): confere o formato do e-mail e devolve um id; nada sai para a rede.
      LAB_RESEND_URL: http://127.0.0.1:3999
      # Rotas falsas (scripts/lab/rotas-falso.mjs): tempos determinísticos no formato Mapbox/Google; nada sai para a rede.
      LAB_ROTAS_URL: http://127.0.0.1:3998
      TESTES_BASE_URL: http://localhost:3123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Subir o Supabase local (todas as migrações)
        # O runner às vezes chega com a porta 54322 ocupada ("address already in use",
        # run 38179479994): não é falha de migração. Mostra quem ocupa a porta, limpa
        # restos de containers e tenta de novo até 3 vezes.
        run: |
          for tentativa in 1 2 3; do
            if supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit,realtime; then
              exit 0
            fi
            echo "::warning::supabase start falhou (tentativa $tentativa/3). Portas em uso:"
            (ss -ltnp 2>/dev/null | grep -E ':543(2[0-9])\b' || echo "nenhuma porta 5432x listada")
            supabase stop --no-backup || true
            docker rm -f $(docker ps -aq) 2>/dev/null || true
            sleep $((tentativa * 5))
          done
          echo "::error::supabase start falhou 3 vezes"
          exit 1

      - name: Acertar com produção (role como texto + políticas extras)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/lab/alinhar-producao.sql

      - name: Conferir o banco (asserções de segurança)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/lab/conferir-banco.sql

      - name: Chaves locais e senha da noite (mascaradas)
        run: |
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          SENHA="$(openssl rand -hex 16)"
          SOCIOS="lab-$(openssl rand -hex 8)"
          echo "::add-mask::$ANON_KEY"; echo "::add-mask::$SERVICE_ROLE_KEY"; echo "::add-mask::$SENHA"; echo "::add-mask::$SOCIOS"
          {
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "LAB_SENHA=$SENHA"
            echo "SOCIOS_ACCESS_CODE=$SOCIOS"
          } >> "$GITHUB_ENV"

      - name: Criar as personas e os imóveis de teste
        run: node scripts/lab/seed-lab.mjs

      - name: Criar a massa da varredura visual (t249)
        # Contas @varredura.lab.vivanomads.test e tests/laboratorio/saida/varredura.json. Sem este passo a t249 ficava
        # pulada em toda execução. Se falhar, a suíte segue e a t249 reprova dizendo que falta a massa.
        continue-on-error: true
        run: node scripts/lab/massa-varredura.mjs

      - name: Build do site (modo simulado)
        run: npm run build

      - name: Subir o site em localhost:3123
        run: |
          node scripts/lab/resend-falso.mjs 3999 > tests/laboratorio/saida/resend-falso.log 2>&1 &
          node scripts/lab/rotas-falso.mjs 3998 > tests/laboratorio/saida/rotas-falso.log 2>&1 &
          npx next start -p 3123 > tests/laboratorio/saida/servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3123/ || (cat tests/laboratorio/saida/servidor.log; exit 1)

      - name: Instalar Chromium do Playwright
        # A instalação às vezes trava sem erro (apt/download); limite por tentativa e até 3 tentativas.
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            timeout 270 npx playwright install --with-deps chromium webkit && exit 0
            echo "tentativa $i travou ou falhou"
          done
          exit 1

      - name: Rodar a suíte E2E
        id: e2e
        continue-on-error: true
        run: npx playwright test --reporter=list,html,json --workers=2 --global-timeout=3900000 > tests/laboratorio/saida/e2e.txt 2>&1
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tests/laboratorio/saida/resultado.json

      - name: Resumo da noite
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Laboratório — $(date -u +%Y-%m-%d)"
            grep -E "^\s+[0-9]+ (passed|failed|skipped|flaky)" tests/laboratorio/saida/e2e.txt || true
            echo
            echo "### Por spec (passou / falhou)"
            node scripts/lab/resumo-specs.mjs tests/laboratorio/saida/resultado.json || true
            echo
            echo "Envios simulados (nada saiu para a rede):"
            if [ -f "$LAB_OUTBOX" ]; then cut -d'"' -f4 "$LAB_OUTBOX" | sort | uniq -c; else echo "nenhum"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatório, prints e vídeos das falhas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-${{ github.run_id }}
          path: |
            playwright-report/
            tests/e2e/.artifacts/
            tests/laboratorio/saida/
          retention-days: 14

      - name: Registrar no banco
        # Uma linha em public.lab_execucoes por execução. PR só do próprio repositório (nunca de fork, que não
        # recebe segredo): grava gatilho=pull_request com o commit da cabeça do PR (ordem 1424d64a). Só contagens e títulos
        # de testes. O JSON entra como variável do psql (:'resumo'::jsonb) — nada de texto cru
        # dentro do SQL. A URL do banco vem do secret e nunca é impressa.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATILHO: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Sem o secret SUPABASE_DB_URL: resultado não gravado no banco."
            exit 0
          fi
          RESUMO="$(node scripts/lab/resumo-specs.mjs --json tests/laboratorio/saida/resultado.json)"
          CATEGORIA="$(node scripts/lab/gerar-cobertura.mjs --json || echo '{}')"
          psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -v sha="$COMMIT_SHA" -v gatilho="$GATILHO" -v run_url="$RUN_URL" -v resumo="$RESUMO" -v categoria="$CATEGORIA" >/dev/null <<'SQL'
          insert into public.lab_execucoes (commit_sha, gatilho, passou, falhou, pulou, instavel, por_spec, falhas, run_url, por_categoria)
          select :'sha', :'gatilho',
                 (j->>'passou')::int, (j->>'falhou')::int, (j->>'pulou')::int, (j->>'instavel')::int,
                 j->'por_spec', j->'falhas', :'run_url', :'categoria'::jsonb
            from (select :'resumo'::jsonb as j) x;
          SQL

      - name: Marcar a execução como falha se algum teste falhou
        if: ${{ steps.e2e.outcome == 'failure' && github.event_name != 'pull_request' }}
        run: exit 1
