name: Lab crítico (fluxos críticos)

# Ordem d86d0678: em CADA PR e a cada merge na main roda um conjunto curto de fluxos críticos (login, publicar
# anúncio, candidatura→contrato→assinatura, abrir chamado, upload de foto) e publica o status check "lab-critico".
# A lista fica em tests/laboratorio/fluxos-criticos.json.
# Portão de PR (decisão do Muse, 21/10): em PR roda também os specs que o próprio PR cria ou altera, e qualquer teste
# que falhe — inclusive o que só passa no retry — deixa o job vermelho. A suíte completa roda na main e no noturno
# (laboratorio.yml), não em PR. Mesmo ambiente do laboratório completo (Supabase local,
# integrações simuladas, nada de segredo de produção). Para EXIGIR este check antes de mesclar, só o Daniel liga:
# GitHub > Settings > Branches > regra da main > "Require status checks to pass" > marcar "lab-critico".
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-critico-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lab-critico:
    name: lab-critico
    runs-on: ubuntu-latest
    # 105 = 10 de preparação + 60 da instalação dos navegadores no pior caso (runner lento) + 35 dos testes. Numa rodada
    # normal a instalação leva 1 a 2 minutos e nada disto muda; os testes têm limite próprio, abaixo.
    timeout-minutes: 105
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SITE_URL: http://localhost:3123
      INTEGRACOES_SIMULADAS: "on"
      LAB_OUTBOX: ${{ github.workspace }}/tests/laboratorio/saida/envios-simulados.jsonl
      # Resend falso (scripts/lab/resend-falso.mjs): confere o formato do e-mail e devolve um id; nada sai para a rede.
      LAB_RESEND_URL: http://127.0.0.1:3999
      # LinkedIn falso (scripts/lab/linkedin-falso.mjs, 63-B): OIDC mínimo com id_token RS256 de verdade; nada sai para a rede.
      LAB_LINKEDIN_URL: http://127.0.0.1:3997
      # Rotas falsas (scripts/lab/rotas-falso.mjs): tempos determinísticos no formato Mapbox/Google; nada sai para a rede.
      LAB_ROTAS_URL: http://127.0.0.1:3998
      TESTES_BASE_URL: http://localhost:3123
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico até a base do PR, para listar os specs que o PR alterou.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Subir o Supabase local (todas as migrações)
        # E792: porta do banco presa na VM do runner ("failed to bind host port 0.0.0.0:54322/tcp", sem ninguém
        # escutando) → o script sobe o banco numa porta livre e grava LAB_DB_URL; outras falhas: limpa e reinicia o Docker.
        run: scripts/lab/subir-supabase.sh

      - name: Acertar com produção (role como texto + políticas extras)
        run: psql "$LAB_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/lab/alinhar-producao.sql

      - name: Conferir o banco (asserções de segurança)
        run: psql "$LAB_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/lab/conferir-banco.sql

      - name: Chaves locais e senha da noite (mascaradas)
        run: |
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          SENHA="$(openssl rand -hex 16)"
          SOCIOS="lab-$(openssl rand -hex 8)"
          echo "::add-mask::$ANON_KEY"; echo "::add-mask::$SERVICE_ROLE_KEY"; echo "::add-mask::$SENHA"; echo "::add-mask::$SOCIOS"
          {
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "LAB_SENHA=$SENHA"
            echo "SOCIOS_ACCESS_CODE=$SOCIOS"
          } >> "$GITHUB_ENV"

      - name: Criar as personas e os imóveis de teste
        run: node scripts/lab/seed-lab.mjs

      - name: Criar a massa da varredura visual (t249)
        # Contas @varredura.lab.vivanomads.test e tests/laboratorio/saida/varredura.json. Sem este passo a t249 ficava
        # pulada em toda execução. Aqui no portão, se falhar, o job fica vermelho.
        run: node scripts/lab/massa-varredura.mjs

      - name: Build do site (modo simulado)
        run: npm run build

      - name: Subir o site em localhost:3123
        run: |
          node scripts/lab/resend-falso.mjs 3999 > tests/laboratorio/saida/resend-falso.log 2>&1 &
          node scripts/lab/linkedin-falso.mjs 3997 > tests/laboratorio/saida/linkedin-falso.log 2>&1 &
          node scripts/lab/rotas-falso.mjs 3998 > tests/laboratorio/saida/rotas-falso.log 2>&1 &
          npx next start -p 3123 > tests/laboratorio/saida/servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3123/ || (cat tests/laboratorio/saida/servidor.log; exit 1)

      - name: Baixar a imagem do Playwright (E1040, navegadores e dependências já vêm nela, nada de apt)
        # E1040 (ORDEM-DUET-216/229): o desenho do E1037 (#4034) neste workflow. A imagem OFICIAL do Playwright, na MESMA
        # versão do @playwright/test (o teste e1040-imagem-outros-workflows.test.ts prende as duas). Vem do MCR, não do
        # espelho do Ubuntu; tentativas curtas por segurança.
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            timeout 300 docker pull mcr.microsoft.com/playwright:v1.61.1-noble && exit 0
            echo "tentativa $i do pull falhou"
            if [ "$i" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      - name: Rodar os fluxos críticos
        id: e2e
        # Limite próprio: é a folga que os testes já tinham (os 40 min antigos do job menos a preparação e a instalação).
        # O job cresceu para caber a instalação lenta; um teste travado não fica pendurado por mais tempo por isso.
        timeout-minutes: 70
        run: |
          # E1040: só `npx playwright …` corre na imagem oficial, com a rede do runner e como o utilizador do runner (os
          # resultados ficam no workspace). O resto do `npx` segue o do runner. As linhas de comando ficam iguais.
          npx() {
            if [ "${1:-}" != playwright ]; then command npx "$@"; return; fi
            shift
            docker run --rm --network host --ipc host --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:$PWD" -w "$PWD" \
              $(env | cut -d= -f1 | grep -E '^(NEXT_PUBLIC_|LAB_|TESTES_|INTEGRACOES_|SUPABASE_|PLAYWRIGHT_|CI$)' | sed 's/^/-e /') \
              mcr.microsoft.com/playwright:v1.61.1-noble npx playwright "$@"
          }
          # ENSAIO (nunca mergear): a perna do check-in da Estadia (t2208).
          set +e
          npx playwright test tests/e2e/specs/t1808-e1251-grupo-a-ponta-a-ponta.spec.ts tests/e2e/specs/t1806-e1242-faixa-e-pagina-de-avisos.spec.ts tests/e2e/specs/t830-e444-sino-faixa.spec.ts --project=chromium --retries=0 --workers=1 --project=chromium --retries=0 --workers=1 --reporter=list,json 2>&1 | tee tests/laboratorio/saida/e2e.txt
          B="${PIPESTATUS[0]}"
          set -e
          echo "ensaio: t2208 saída $B"
          [ "$B" -eq 0 ] || exit 1
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tests/laboratorio/saida/resultado.json
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Resultado (cole no corpo do PR)
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## lab-critico — ${{ github.sha }}"
            grep -E "^\s+[0-9]+ (passed|failed|skipped|flaky)" tests/laboratorio/saida/e2e.txt || true
            echo
            node scripts/lab/resumo-specs.mjs tests/laboratorio/saida/resultado.json || true
            # E744 T3: os specs @sensivel-carga que o PR alterou rodam à parte, com 1 worker.
            if grep -qE "^\s+[0-9]+ (passed|failed|flaky)" tests/laboratorio/saida/e2e-carga.txt 2>/dev/null; then
              echo
              echo "### Sensíveis à carga (1 worker)"
              grep -E "^\s+[0-9]+ (passed|failed|skipped|flaky)" tests/laboratorio/saida/e2e-carga.txt || true
              echo
              node scripts/lab/resumo-specs.mjs tests/laboratorio/saida/resultado-carga.json || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatório e prints das falhas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab-critico-${{ github.run_id }}
          path: |
            tests/e2e/.artifacts/
            tests/laboratorio/saida/
          retention-days: 7
