name: E2E (Playwright)

# Roda a suíte E2E assim que o deploy fica pronto (deployment_status = success):
# Production -> https://vivanomads.com.br (domínio próprio, sem proteção da Vercel);
# Preview -> URL do deploy com o bypass; sem o segredo de bypass o preview é PULADO
# com aviso (não fica vermelho). Também roda sob demanda com uma URL manual.
# A decisão está em scripts/ci/e2e-alvo.sh (com teste em src/lib/ci).
# Segredos (contas de teste) vêm de GitHub Secrets — nunca no yml.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL alvo (preview da Vercel ou produção p/ smoke)"
        required: true

concurrency:
  group: e2e-${{ github.event.deployment_status.target_url || github.event.inputs.base_url || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # No gatilho de deploy, só roda quando o preview ficou pronto (success).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bypass da Deployment Protection da Vercel (preview protegido). Sem ele, a
      # suíte cai na tela de login da Vercel. O config/global-setup só mandam os
      # headers quando esta variável existe.
      TEM_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
      TESTES_INQUILINO_EMAIL: ${{ secrets.TESTES_INQUILINO_EMAIL }}
      TESTES_INQUILINO_SENHA: ${{ secrets.TESTES_INQUILINO_SENHA }}
      TESTES_INQUILINO_NOME: ${{ secrets.TESTES_INQUILINO_NOME }}
      # inquilino2 é OPCIONAL (T-TRAV-C recusa a 2ª); ausente → os testes se pulam.
      TESTES_INQUILINO2_EMAIL: ${{ secrets.TESTES_INQUILINO2_EMAIL }}
      TESTES_INQUILINO2_SENHA: ${{ secrets.TESTES_INQUILINO2_SENHA }}
      TESTES_INQUILINO2_NOME: ${{ secrets.TESTES_INQUILINO2_NOME }}
      TESTES_PROPRIETARIO_EMAIL: ${{ secrets.TESTES_PROPRIETARIO_EMAIL }}
      TESTES_PROPRIETARIO_SENHA: ${{ secrets.TESTES_PROPRIETARIO_SENHA }}
      TESTES_PROPRIETARIO_NOME: ${{ secrets.TESTES_PROPRIETARIO_NOME }}
      TESTES_ADMIN_EMAIL: ${{ secrets.TESTES_ADMIN_EMAIL }}
      TESTES_ADMIN_SENHA: ${{ secrets.TESTES_ADMIN_SENHA }}
      TESTES_ADMIN_NOME: ${{ secrets.TESTES_ADMIN_NOME }}
      # Seed (service role do projeto de TESTE) — habilita T-TRAV-B/C (pedido +
      # imóvel publicado). Se o segredo não existir, o passo de seed é pulado e
      # os testes dependentes se pulam sozinhos (resilientes).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TESTES_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TESTES_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver alvo do E2E
        id: alvo
        env:
          EVENTO: ${{ github.event_name }}
          AMBIENTE: ${{ github.event.deployment_status.environment }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          INPUT_URL: ${{ github.event.inputs.base_url }}
          TEM_BYPASS: ${{ env.TEM_BYPASS_SECRET }}
        run: |
          bash scripts/ci/e2e-alvo.sh | tee -a "$GITHUB_OUTPUT"
          AVISO=$(bash scripts/ci/e2e-alvo.sh | sed -n 's/^aviso=//p')
          [ -n "$AVISO" ] && echo "::warning::$AVISO" || true

      - name: Definir ambiente do E2E
        if: steps.alvo.outputs.rodar == 'true'
        run: |
          echo "TESTES_BASE_URL=${{ steps.alvo.outputs.base_url }}" >> "$GITHUB_ENV"
          if [ "${{ steps.alvo.outputs.bypass }}" = "true" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET=${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" >> "$GITHUB_ENV"
          fi

      - name: Checar que o alvo responde
        if: steps.alvo.outputs.rodar == 'true' && steps.alvo.outputs.bypass != 'true'
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.alvo.outputs.base_url }}/api/health" || echo "000")
          echo "HTTP /api/health -> ${CODE}"
          [ "${CODE}" = "200" ] || { echo "::error::Alvo nao respondeu 200."; exit 1; }

      # Diagnóstico do bypass ANTES de instalar nada (falha em segundos). Nunca
      # imprime o segredo (só se está vazio e o tamanho). Aborta se o bypass não
      # devolver 200 — assim não se gasta 2 min de instalação para dar "tudo barrado".
      - name: Diagnóstico do bypass da Vercel
        if: steps.alvo.outputs.rodar == 'true' && steps.alvo.outputs.bypass == 'true'
        run: |
          echo "== Diagnóstico do bypass (sem expor o segredo) =="
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "SECRET: VAZIO — não chegou ao job (causa 1: lugar errado no GitHub; use Settings > Secrets and variables > Actions > Repository secrets)."
          else
            echo "SECRET: preenchido (tamanho=${#VERCEL_AUTOMATION_BYPASS_SECRET})."
          fi
          echo "BASE_URL: ${TESTES_BASE_URL}"
          NO=$(curl -s -o /dev/null -w "%{http_code}" "${TESTES_BASE_URL}/api/health" || echo "000")
          WITH=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            "${TESTES_BASE_URL}/api/health" || echo "000")
          echo "HTTP /api/health  ->  sem header: ${NO}   com header: ${WITH}"
          if [ "${WITH}" = "200" ]; then
            echo "Bypass OK (200). Seguindo para a suíte."
          else
            echo "::error::Bypass NAO passou (com header=${WITH}, esperado 200). Suite abortada."
            echo "Leitura: SECRET vazio -> causa 1 (lugar errado no GitHub). 401/403 com header -> causa 2 (valor errado). 200 aqui mas Playwright cai na Vercel -> causa 3 (envio do header no codigo)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.alvo.outputs.rodar == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        if: steps.alvo.outputs.rodar == 'true'
        run: npm ci

      - name: Instalar Chromium do Playwright
        if: steps.alvo.outputs.rodar == 'true'
        run: npx playwright install --with-deps chromium

      - name: Semear dados de teste (se houver service role)
        if: ${{ steps.alvo.outputs.rodar == 'true' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run seed:teste

      - name: Rodar suíte E2E
        if: steps.alvo.outputs.rodar == 'true'
        run: npm run testes

      - name: Publicar relatório HTML
        if: ${{ !cancelled() && steps.alvo.outputs.rodar == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
