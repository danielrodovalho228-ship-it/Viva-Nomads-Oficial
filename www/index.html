<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Viva Nomads</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       background:#123b26;color:#f7f6f2;text-align:center;padding:24px}
  .logo{font-size:26px;font-weight:800}
  .logo b{color:#6cbe2a}
  p{color:#c2dcc4;font-size:15px;max-width:30ch;line-height:1.5}
  .dot{width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:#6cbe2a;
       border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="dot"></div>
  <div class="logo">Viva<b>Nomads</b></div>
  <p>Carregando o app… Verifique sua conexão com a internet.</p>
</body>
</html>
